# Builds the site and publishes it to GitHub Pages on every push to main.
# Review copy: served at https://detichitateli.github.io/ and hidden from search engines (NOINDEX=1).
# At launch on the real domain: set SITE_URL to the domain and drop NOINDEX.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
          SITE_URL: https://detichitateli.github.io
          NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
